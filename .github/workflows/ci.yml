name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.16.1
          package_json_file: samples/MonixOne.OidcProxy.Yarp.SampleHost/ClientApp/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: samples/MonixOne.OidcProxy.Yarp.SampleHost/ClientApp/pnpm-lock.yaml
      - name: Install SPA and interactive documentation
        working-directory: samples/MonixOne.OidcProxy.Yarp.SampleHost/ClientApp
        run: pnpm install --frozen-lockfile
      - name: Test SPA and documentation
        working-directory: samples/MonixOne.OidcProxy.Yarp.SampleHost/ClientApp
        run: pnpm test
      - name: Build SPA and documentation
        working-directory: samples/MonixOne.OidcProxy.Yarp.SampleHost/ClientApp
        run: pnpm build
      - name: Restore
        run: dotnet restore MonixOne.OidcProxy.Yarp.sln
      - name: Build
        run: dotnet build MonixOne.OidcProxy.Yarp.sln -c Release --no-restore -p:GeneratePackageOnBuild=false
      - name: Verify unused usings
        run: dotnet format style MonixOne.OidcProxy.Yarp.sln --no-restore --diagnostics IDE0005 --verify-no-changes
      - name: OIDC, YARP, OpenIddict/PostgreSQL and real Redis tests
        run: dotnet test MonixOne.OidcProxy.Yarp.sln -c Release --no-build --logger trx --collect:'XPlat Code Coverage'
      - name: Repeat concurrency and interoperability tests
        run: dotnet test tests/MonixOne.OidcProxy.Yarp.Tests/MonixOne.OidcProxy.Yarp.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~RefreshLogoutTests|FullyQualifiedName~RefreshProtocolTests|FullyQualifiedName~OpenIddictFlowTests'
      - name: Pack the YARP package
        run: dotnet pack src/MonixOne.OidcProxy.Yarp/MonixOne.OidcProxy.Yarp.csproj -c Release --no-build -o artifacts/packages
      - name: Publish sample with compiled SPA and documentation
        run: dotnet publish samples/MonixOne.OidcProxy.Yarp.SampleHost/MonixOne.OidcProxy.Yarp.SampleHost.csproj -c Release --no-build -o artifacts/sample-host
