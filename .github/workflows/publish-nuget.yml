name: Publish NuGet

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-nuget
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.pull_request.merged == true && github.repository == 'Shulyakovskiy/MonixOne.OidcProxy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore MonixOne.OidcProxy.Yarp.sln
      - name: Build
        run: dotnet build MonixOne.OidcProxy.Yarp.sln -c Release --no-restore -p:GeneratePackageOnBuild=false
      - name: Verify package behavior
        run: dotnet test MonixOne.OidcProxy.Yarp.sln -c Release --no-build
      - name: Pack
        run: dotnet pack src/MonixOne.OidcProxy.Yarp/MonixOne.OidcProxy.Yarp.csproj -c Release --no-build -o artifacts/packages
      - name: Authenticate using NuGet trusted publishing
        uses: NuGet/login@ebc737b6fc418a6ca0073cf116ec8dc156d8b81e # v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish package and symbols
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push artifacts/packages/MonixOne.OidcProxy.Yarp.*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
