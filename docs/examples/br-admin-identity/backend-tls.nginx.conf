# Template: the Node backend currently listens on HTTP 8000.
# Expose it only through this verified internal TLS endpoint to the BFF.
log_format admin_backend_path_only '$remote_addr $request_method $uri $status';

server {
    listen 443 ssl;
    server_name admin-identity-backend.internal.invalid;
    access_log /var/log/nginx/admin-backend.access.log admin_backend_path_only;
    ssl_certificate /run/secrets/admin-backend.fullchain.pem;
    ssl_certificate_key /run/secrets/admin-backend.key;

    # Legacy Node browser-session endpoints are not part of the BFF contract.
    location = /session-api { return 404; }
    location /session-api/ { return 404; }
    location / {
        proxy_pass http://admin-identity:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_redirect off;
    }
}
