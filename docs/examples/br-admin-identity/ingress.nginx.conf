# Template: provision DNS/certificates and replace internal upstream names first.
# Include log_format in the nginx http {} context; OAuth query values are omitted.
log_format bff_path_only '$remote_addr $request_method $uri $status';

server {
    listen 443 ssl;
    server_name admin-dev.intra-beetroute.ru;
    ssl_certificate /run/secrets/admin-public.fullchain.pem;
    ssl_certificate_key /run/secrets/admin-public.key;
    access_log /var/log/nginx/admin-bff.access.log bff_path_only;

    location = / { return 302 /admin/; }
    location = /admin { return 308 /admin/; }
    location /admin/ {
        # No URI/trailing slash: preserve /admin/ all the way to BFF PathBase.
        proxy_pass http://shared-spa-bff:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_redirect off;
        # Do not rewrite/hide Set-Cookie or cache auth/callback responses.
    }
    location / { return 404; }
}
